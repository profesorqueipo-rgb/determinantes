&lt;script&gt;
(() =&gt; {
const root=document.getElementById(&#x27;det-practica&#x27;), $=id=&gt;root.querySelector(&#x27;#dp-&#x27;+id);
const ri=(a,b)=&gt;Math.floor(Math.random()*(b-a+1))+a, nz=()=&gt;{let x=0;while(!x)x=ri(-4,4);return x;};
const clone=A=&gt;A.map(r=&gt;r.slice()), minor=(A,i,j)=&gt;A.filter((_,k)=&gt;k!==i).map(r=&gt;r.filter((_,k)=&gt;k!==j));
